services:
  postgres:
    # Pinned to 16 because 16 is the version every migration in this repository
    # has actually been executed against, constraints and triggers included.
    # Moving to 17 is a deployment decision with a re-verification attached,
    # not a version bump.
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rescue
      POSTGRES_PASSWORD: rescue
      POSTGRES_DB: rescue
    ports: ["5432:5432"]
    volumes: ["rescue_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rescue"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["rescue_minio:/data"]
  # ------------------------------------------------------- observability
  # Under a profile, so `docker compose up -d` stays the three things a
  # developer needs and nobody waits on a monitoring stack to run a test.
  #   docker compose --profile observability up -d
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      # Needed to reload rules without a restart: curl -XPOST localhost:9090/-/reload
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      # The scrape token. Create it before starting:
      #   echo -n "$METRICS_TOKEN" > deploy/prometheus/metrics-token
      # It is gitignored; an empty file is fine when the API has no token set.
      - ./deploy/prometheus/metrics-token:/etc/prometheus/metrics-token:ro
      - rescue_prometheus:/prometheus
    ports: ["9090:9090"]
    environment:
      RESCUE_ENV: development
    extra_hosts:
      # The API and the worker run on the host under `pnpm dev`, not in
      # compose. Without this the scrape targets resolve to the container
      # itself and every series is missing, which looks like an outage.
      - "api:host-gateway"
      - "worker:host-gateway"

  alertmanager:
    profiles: ["observability"]
    image: prom/alertmanager:v0.28.0
    volumes:
      - ./deploy/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ["9093:9093"]

volumes:
  rescue_postgres:
  rescue_minio:
  rescue_prometheus:
