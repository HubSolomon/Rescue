services:
  postgres:
    # Pinned to 16 because 16 is the version every migration in this repository
    # has actually been executed against, constraints and triggers included.
    # Moving to 17 is a deployment decision with a re-verification attached,
    # not a version bump.
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rescue
      POSTGRES_PASSWORD: rescue
      POSTGRES_DB: rescue
    ports: ["5432:5432"]
    volumes: ["rescue_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rescue"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["rescue_minio:/data"]
volumes:
  rescue_postgres:
  rescue_minio:
