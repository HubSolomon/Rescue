# The demo deployment.
#
# Two services, no database, no identity provider, no bucket -- so this needs
# none of the accounts a real deployment does, and can go up today. The store
# is in-memory and the evidence signer is the mock, which means the data resets
# on every restart and is meant to.
#
# This file is NOT the production deployment. That one is four services,
# managed Postgres, a real OIDC provider and an S3 bucket, and it is described
# in docs/runbooks/DEPLOYMENT.md. Keeping the demo in its own blueprint is
# deliberate: a single file with a `demo` flag through it is how a demo setting
# reaches production.
#
# ---------------------------------------------------------------- the gate
#
# The demo runs the API with NODE_ENV=development, which is what keeps
# POST /v1/auth/dev-token alive -- the endpoint that mints a session for any
# seeded person with no password. Without that there is nothing to demonstrate,
# because nobody has an account. With it, and no gate, anyone who finds the URL
# is a dispatcher.
#
# So there are two locks, and they are different locks:
#
#   web -> the public URL, behind HTTP Basic. A person types the password once
#          and the browser remembers it. DEMO_GATE_PASSWORD.
#   api -> also public, because private services are a paid plan here and
#          "secure until someone downgrades" is not a property. It refuses
#          every request that does not carry DEMO_API_KEY in `x-demo-key`.
#
# The browser never needs the API key. Every call this product makes to the API
# is made by the Next server (apps/web/lib/api.ts is `server-only`), so the key
# lives in the web container's environment and never in a page.
#
# Both values live in one environment group so the two services cannot drift
# apart -- a regenerated key on one side only would take the demo down.

envVarGroups:
  - name: rescue-demo-secrets
    envVars:
      # Generated by Render, and never seen by anyone. Only the two services
      # need it and they read it from here.
      - key: DEMO_API_KEY
        generateValue: true

      # The password a visitor types. `sync: false` prompts for it once, in the
      # dashboard, at blueprint creation -- so the one credential a human has
      # to know is the one credential not written in this file.
      - key: DEMO_GATE_PASSWORD
        sync: false
      - key: DEMO_GATE_USER
        value: rescue

      # Session signing and the registration hash. Generated, because in a demo
      # nothing outlives a restart and there is nothing to keep them in sync
      # with. In production REGISTRATION_HASH_KEY is write-once and generating
      # it per deploy would orphan every stored hash -- see the runbook.
      - key: JWT_SECRET
        generateValue: true
      - key: REGISTRATION_HASH_KEY
        generateValue: true

services:
  # ------------------------------------------------------------------- api
  - type: web
    name: rescue-demo-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./deploy/docker/api.Dockerfile
    dockerContext: .
    # Liveness, not readiness. /v1/ready checks the database, and there is no
    # database here. /v1/health is also the one path the gate lets through,
    # precisely so this check can reach it.
    healthCheckPath: /v1/health
    envVars:
      - fromGroup: rescue-demo-secrets

      # Development, and that is the honest name for it: this is a build with
      # the development sign-in enabled. The gate above is what makes that
      # survivable on a public URL. parseConfig would refuse to start in
      # production without a real identity provider, which is the behaviour
      # that keeps this from ever being an accident.
      - key: NODE_ENV
        value: development

      # In-memory store: DATABASE_URL is deliberately absent. The API falls
      # back to it and every job disappears on restart.
      - key: STORAGE_PROVIDER
        value: mock

      # Render routes public traffic to $PORT. The API reads API_PORT, so both
      # are set to the same number rather than hoping the two agree.
      - key: PORT
        value: 10000
      - key: API_PORT
        value: 10000
      - key: API_HOST
        value: 0.0.0.0

      # One proxy in front: Render's load balancer. Too low and every visitor
      # shares one rate-limit bucket keyed on the balancer; too high and a
      # client can forge X-Forwarded-For and get a bucket to itself.
      - key: TRUST_PROXY_HOPS
        value: 1

      # CORS, and unused here: no browser ever calls this API, so no preflight
      # is ever made. A literal rather than a `fromService` reference because
      # that yields a bare hostname and this needs an origin, scheme included.
      # If Render suffixes the web service's name to avoid a collision, this
      # goes stale and nothing breaks -- which is the reason it is safe to
      # write down rather than derive.
      - key: WEB_ORIGIN
        value: https://rescue-demo-web.onrender.com

  # ------------------------------------------------------------------- web
  - type: web
    name: rescue-demo-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./deploy/docker/web.Dockerfile
    dockerContext: .
    # Exempt from the gate, or the probe gets a 401 and Render restarts a
    # container that is working.
    healthCheckPath: /healthz
    envVars:
      - fromGroup: rescue-demo-secrets

      # API_URL, not NEXT_PUBLIC_API_URL. The public one is inlined into the
      # browser bundle at build time; this one is read by the Next server at
      # request time, which is where every call in this app is made from. The
      # demo therefore needs no build argument at all.
      - key: API_URL
        fromService:
          name: rescue-demo-api
          type: web
          property: host

      - key: NODE_ENV
        value: production
# ---------------------------------------------------------------- caveats
#
# The free plan sleeps a service after fifteen minutes of no traffic, so the
# first visit after a quiet spell waits for a cold start. Sending someone a
# link: open it yourself first.
#
# Evidence upload and download do not work here, and cannot. The mock signer
# produces correctly shaped presigned URLs and stores nothing, so a proof link
# redirects to an address with no object behind it. Everything up to the
# upload -- the ticket, the size and type refusals, the state change -- is
# real. That is the one part of the product a demo cannot show, and it is why
# step 4 of the runbook's post-deploy checklist exists.
#
# There is no worker. Notifications queue in the outbox and are never
# dispatched, and the dispatch sweep never runs, so an offer that would time
# out simply does not. Adding it is one more service block with
# `dockerfilePath: ./deploy/docker/api.Dockerfile` and
# `dockerCommand: node dist/worker/main.js` -- left out because a demo nobody
# is watching does not need a background process burning a free instance.
